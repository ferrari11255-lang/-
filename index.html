<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="IRODORI 日文">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.svg">
<link rel="stylesheet" href="app.css?v=6">
<title>IRODORI 日文學習</title>
</head>
<body>
<main class="app">
  <div class="top">
    <div class="brand"><div class="logo">あ</div><div><h1>IRODORI 日文</h1><div class="sub">每天一點點，日文就會留下來。</div></div></div>
    <button id="installBtn" class="install" type="button">📲 加到桌面</button>
  </div>

  <section id="home" class="screen active">
    <div class="hero">
      <div class="eyebrow">LESSON 07</div>
      <h2>部屋が4つあります</h2>
      <p>房子、家具、形容詞與「哪裡有什麼」的說法。</p>
      <div class="progress"><div class="track"><div id="bar" class="bar"></div></div><div id="ptext" class="count"></div></div>
    </div>

    <div class="soundbox">
      <button id="testSound" class="soundbtn" type="button">🔊 發音測試</button>
      <div class="soundtext"><strong>先測試聲音</strong><small id="soundStatus">按一下，應該會聽到「こんにちは」。</small></div>
    </div>

    <div id="installHelp" class="installbox">
      <strong>把 APP 放到手機桌面：</strong><br>
      Chrome：右上角 ⋮ →「新增至主畫面」或「安裝應用程式」。<br>
      Samsung Internet：右下角 ☰ →「新增頁面至」→「主螢幕」。<br>
      <span id="installStatus">如果瀏覽器支援直接安裝，按上方「📲 加到桌面」會跳出安裝視窗。</span>
    </div>

    <div class="sectionTitle"><h3>今天想怎麼學？</h3><span>挑一個就開始</span></div>
    <div class="grid">
      <button class="mode" data-open="words" type="button"><span class="mi">🧸</span><strong>單字</strong><small>圖示＋假名＋中文</small></button>
      <button class="mode" data-open="sentences" type="button"><span class="mi">💬</span><strong>句子</strong><small>完整句型＋發音</small></button>
      <button class="mode" data-open="quiz" type="button"><span class="mi">🎯</span><strong>小測驗</strong><small>隨機 10 題複習</small></button>
      <button class="mode" data-open="learned" type="button"><span class="mi">🌱</span><strong>已學會</strong><small>查看你的進度</small></button>
    </div>
    <div class="daily"><div class="dicon">🌸</div><div><strong>不用一次背完</strong><small>先學 5 個單字，再聽 3 句就很好。</small></div></div>
  </section>

  <section id="study" class="screen">
    <button id="back" class="back" type="button">← 回首頁</button>
    <div class="head"><div><small>LESSON 07</small><h2 id="studyTitle">單字</h2></div><small id="studyCount"></small></div>
    <input id="search" class="search" type="search" placeholder="搜尋日文、假名或中文…">
    <div id="chips" class="chips"></div>
    <div id="cards" class="cards"></div>
    <div id="empty" class="empty" style="display:none">找不到符合內容。</div>
  </section>

  <section id="quizScreen" class="screen">
    <button id="quizBack" class="back" type="button">← 回首頁</button>
    <div class="head"><div><small>LESSON 07</small><h2>小測驗</h2></div><small id="scoreText"></small></div>
    <div id="quizBox" class="quiz"></div>
  </section>
</main>

<nav class="nav">
  <button type="button" data-nav="home" class="active"><b>⌂</b>首頁</button>
  <button type="button" data-nav="words"><b>あ</b>單字</button>
  <button type="button" data-nav="quiz"><b>✓</b>測驗</button>
</nav>
<script src="data.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>
