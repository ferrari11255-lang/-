<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>12 題快速 MBTI 測驗</title>
  <style>
    * { box-sizing: border-box; }
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --text:#20222a;
      --muted:#777b8a;
      --line:#e8eaf1;
      --accent:#665cf6;
      --accent2:#8b84ff;
      --soft:#f0efff;
      --success:#2f9e74;
    }
    body{
      margin:0;
      font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(102,92,246,.14), transparent 28%),
        radial-gradient(circle at 90% 80%, rgba(139,132,255,.13), transparent 30%),
        var(--bg);
      color:var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .app{
      width:min(720px,100%);
      background:rgba(255,255,255,.94);
      border:1px solid rgba(255,255,255,.8);
      box-shadow:0 24px 70px rgba(37,34,87,.12);
      border-radius:28px;
      padding:28px;
      backdrop-filter:blur(12px);
    }
    .top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:18px;
    }
    .logo{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:800;
      letter-spacing:.2px;
    }
    .logo-badge{
      width:38px;height:38px;border-radius:12px;
      display:grid;place-items:center;
      color:white;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      box-shadow:0 10px 24px rgba(102,92,246,.25);
    }
    .tag{
      font-size:12px;
      color:var(--muted);
      background:#f4f5f9;
      border:1px solid var(--line);
      padding:7px 10px;
      border-radius:999px;
    }
    .hero{
      text-align:center;
      padding:24px 8px 10px;
    }
    h1{
      margin:0 0 12px;
      font-size:clamp(30px,6vw,48px);
      line-height:1.08;
      letter-spacing:-1.5px;
    }
    .gradient{
      background:linear-gradient(135deg,var(--accent),#9b63ff);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }
    .lead{
      margin:0 auto 22px;
      color:var(--muted);
      line-height:1.8;
      max-width:560px;
    }
    button{
      font:inherit;
      border:0;
      cursor:pointer;
      transition:.18s ease;
    }
    .primary{
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:#fff;
      padding:14px 24px;
      border-radius:14px;
      font-weight:700;
      box-shadow:0 12px 25px rgba(102,92,246,.25);
    }
    .primary:hover{ transform:translateY(-2px); }
    .secondary{
      background:#f3f4f8;
      color:var(--text);
      padding:12px 18px;
      border-radius:12px;
      font-weight:700;
    }
    .secondary:hover{ background:#eceef5; }
    .meta{
      margin-top:18px;
      font-size:12px;
      color:#9296a5;
    }
    .hidden{ display:none !important; }

    .progress-wrap{ margin:16px 0 26px; }
    .progress-info{
      display:flex;
      justify-content:space-between;
      color:var(--muted);
      font-size:13px;
      margin-bottom:8px;
    }
    .progress{
      width:100%; height:9px; border-radius:999px;
      background:#eceef5; overflow:hidden;
    }
    .bar{
      height:100%; width:0%;
      background:linear-gradient(90deg,var(--accent),#a873ff);
      border-radius:999px;
      transition:width .25s ease;
    }
    .question-card{
      padding:18px 4px 8px;
      animation:fade .25s ease;
    }
    @keyframes fade{
      from{ opacity:.3; transform:translateY(5px); }
      to{ opacity:1; transform:translateY(0); }
    }
    .q-no{
      font-size:13px;
      color:var(--accent);
      font-weight:800;
      letter-spacing:1px;
      margin-bottom:10px;
    }
    .question{
      font-size:clamp(23px,4vw,32px);
      font-weight:800;
      line-height:1.35;
      margin-bottom:24px;
    }
    .answers{
      display:grid;
      gap:14px;
    }
    .answer{
      text-align:left;
      background:#fff;
      border:1.5px solid var(--line);
      border-radius:18px;
      padding:18px 20px;
      color:var(--text);
      line-height:1.55;
      font-weight:650;
    }
    .answer:hover{
      border-color:#b9b4ff;
      background:var(--soft);
      transform:translateY(-1px);
    }
    .answer strong{
      color:var(--accent);
      margin-right:7px;
    }

    .result{
      text-align:center;
      padding:22px 4px 6px;
      animation:fade .3s ease;
    }
    .result-type{
      display:inline-block;
      padding:10px 18px;
      border-radius:14px;
      background:var(--soft);
      color:var(--accent);
      font-size:40px;
      font-weight:900;
      letter-spacing:4px;
      margin:8px 0 10px;
    }
    .result-name{
      font-size:24px;
      font-weight:900;
      margin-bottom:8px;
    }
    .result-desc{
      color:var(--muted);
      line-height:1.8;
      max-width:580px;
      margin:0 auto 24px;
    }
    .traits{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
      max-width:560px;
      margin:0 auto 24px;
    }
    .trait{
      background:#f7f7fb;
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px;
      font-size:14px;
    }
    .trait b{ color:var(--accent); }
    .actions{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:10px;
    }
    .disclaimer{
      margin-top:24px;
      padding-top:18px;
      border-top:1px solid var(--line);
      color:#999dac;
      font-size:12px;
      line-height:1.6;
    }

    @media(max-width:560px){
      body{ padding:14px; }
      .app{ padding:20px; border-radius:22px; }
      .tag{ display:none; }
      .traits{ grid-template-columns:1fr; }
      .question{ font-size:24px; }
      .answer{ padding:16px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="top">
      <div class="logo"><span class="logo-badge">M</span> Mini MBTI</div>
      <div class="tag">12 題・約 1 分鐘</div>
    </div>

    <section id="startScreen" class="hero">
      <h1>你的個性比較像<br><span class="gradient">哪一種 MBTI？</span></h1>
      <p class="lead">
        不用想太久，選「比較像平常的你」就好。<br>
        12 題快速版，適合辦公室、朋友聚會互相測一下。
      </p>
      <button class="primary" onclick="startQuiz()">開始測驗</button>
      <div class="meta">沒有標準答案，也不用演成理想中的自己 😏</div>
    </section>

    <section id="quizScreen" class="hidden">
      <div class="progress-wrap">
        <div class="progress-info">
          <span id="progressText">第 1 / 12 題</span>
          <span id="progressPercent">8%</span>
        </div>
        <div class="progress"><div id="bar" class="bar"></div></div>
      </div>
      <div id="questionCard" class="question-card"></div>
    </section>

    <section id="resultScreen" class="result hidden">
      <div style="font-size:14px;color:var(--success);font-weight:800;">測驗完成 ✓</div>
      <div id="resultType" class="result-type">INTJ</div>
      <div id="resultName" class="result-name"></div>
      <p id="resultDesc" class="result-desc"></p>
      <div id="traits" class="traits"></div>
      <div class="actions">
        <button class="primary" onclick="copyResult()">複製結果</button>
        <button class="secondary" onclick="restartQuiz()">再測一次</button>
      </div>
      <div class="disclaimer">
        這是 12 題的娛樂型快速測驗，適合初步了解偏好，不等同正式心理衡鑑，也不代表人格永遠固定。
      </div>
    </section>
  </main>

  <script>
    const questions = [
      { axis:"EI", q:"到一個不熟的聚會，你通常會？", a:["主動找人聊天，很快融入","先觀察一下，熟了才開始聊"], score:["E","I"] },
      { axis:"SN", q:"學一個新東西時，你比較喜歡？", a:["先看實際步驟和例子","先理解概念和背後邏輯"], score:["S","N"] },
      { axis:"TF", q:"朋友遇到問題找你，你比較常？", a:["幫他分析怎麼解決","先理解他的感受"], score:["T","F"] },
      { axis:"JP", q:"要出門旅行，你比較像？", a:["先排好行程比較安心","大方向有就好，到時再決定"], score:["J","P"] },

      { axis:"EI", q:"忙了一整週後，你比較想？", a:["約人出去、換個熱鬧環境","自己待著，安靜充電"], score:["E","I"] },
      { axis:"SN", q:"別人講一件事時，你更容易注意？", a:["他實際說了什麼、細節是否合理","這件事背後可能代表什麼"], score:["S","N"] },
      { axis:"TF", q:"做重要決定時，你比較相信？", a:["客觀條件與合理性","自己的價值感與人的感受"], score:["T","F"] },
      { axis:"JP", q:"工作突然多出一件急事，你通常？", a:["重新排順序，趕快把事情控住","先處理眼前最急的，邊做邊調整"], score:["J","P"] },

      { axis:"EI", q:"在群組聊天時，你通常？", a:["想到就回，互動很多","有必要或真的想講才回"], score:["E","I"] },
      { axis:"SN", q:"你比較容易被哪種內容吸引？", a:["實用、馬上能派上用場","新奇、有想像空間的想法"], score:["S","N"] },
      { axis:"TF", q:"和人意見不合時，你更在意？", a:["到底誰的說法比較有道理","怎麼講才不會讓關係太僵"], score:["T","F"] },
      { axis:"JP", q:"面對截止日期，你比較像？", a:["喜歡提早做完，心裡比較舒服","通常越接近期限效率越高"], score:["J","P"] }
    ];

    const types = {
      INTJ:["策略規劃者","獨立、理性、有長期視角，喜歡把複雜問題整理成一套可執行的方法。","長期規劃","獨立思考"],
      INTP:["邏輯探索者","好奇心強、愛拆解問題，對有趣的觀念很著迷，不喜歡被過度限制。","分析推理","創意探索"],
      ENTJ:["目標指揮官","果斷、重效率、擅長推進目標，看到混亂時會很自然地想把事情組織起來。","決策推進","組織能力"],
      ENTP:["點子辯論家","反應快、點子多、喜歡新鮮挑戰，常能看到別人沒注意到的新可能。","靈活創新","快速反應"],
      INFJ:["洞察倡議者","敏銳、有原則、很會讀懂氣氛，通常希望自己做的事帶有意義。","洞察人心","價值導向"],
      INFP:["理想調停者","重視真誠與內在感受，想像力豐富，對自己真正重視的事非常投入。","同理感受","想像力"],
      ENFJ:["熱情引導者","擅長鼓勵與連結他人，容易看見每個人的優點，也很在乎團隊氣氛。","人際連結","鼓舞他人"],
      ENFP:["靈感探索者","熱情、好奇、喜歡自由與可能性，很容易被新鮮有趣的人事物點燃。","熱情創意","適應變化"],
      ISTJ:["務實執行者","可靠、細心、重視秩序與責任，喜歡把事情一件一件穩穩做好。","穩定執行","細節管理"],
      ISFJ:["溫暖守護者","體貼、細心、責任感強，常默默記得別人在乎的小事。","細心照顧","可靠負責"],
      ESTJ:["效率管理者","務實、直接、行動力強，擅長建立規則、分工與清楚的執行方式。","效率管理","果斷執行"],
      ESFJ:["友善協調者","重視互動與關係，善於照顧氣氛，喜歡讓大家都舒服地參與其中。","關係協調","熱心可靠"],
      ISTP:["冷靜解題者","反應冷靜、動手能力強，遇到問題時偏好直接找出最有效率的解法。","臨場解題","實作能力"],
      ISFP:["自在藝術家","溫和、細膩、有自己的審美與價值感，重視自由與真實的生活感受。","美感敏銳","溫和彈性"],
      ESTP:["行動挑戰者","大膽、務實、反應快，喜歡直接行動，在變動環境裡反而容易發揮。","行動力","臨場反應"],
      ESFP:["氣氛體驗家","外向、親切、享受當下，對人與環境很敏銳，常常能把氣氛帶起來。","帶動氣氛","享受當下"]
    };

    let index = 0;
    let scores = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};

    function startQuiz(){
      document.getElementById("startScreen").classList.add("hidden");
      document.getElementById("quizScreen").classList.remove("hidden");
      renderQuestion();
    }

    function renderQuestion(){
      const item = questions[index];
      const percent = Math.round(((index+1)/questions.length)*100);
      document.getElementById("progressText").textContent = `第 ${index+1} / ${questions.length} 題`;
      document.getElementById("progressPercent").textContent = `${percent}%`;
      document.getElementById("bar").style.width = `${percent}%`;

      const card = document.getElementById("questionCard");
      card.innerHTML = `
        <div class="q-no">QUESTION ${String(index+1).padStart(2,"0")}</div>
        <div class="question">${item.q}</div>
        <div class="answers">
          <button class="answer" onclick="choose(0)"><strong>A.</strong>${item.a[0]}</button>
          <button class="answer" onclick="choose(1)"><strong>B.</strong>${item.a[1]}</button>
        </div>
      `;
    }

    function choose(choice){
      const item = questions[index];
      scores[item.score[choice]] += 1;
      index++;
      if(index < questions.length){
        renderQuestion();
      }else{
        showResult();
      }
    }

    function showResult(){
      const result =
        (scores.E > scores.I ? "E" : "I") +
        (scores.S > scores.N ? "S" : "N") +
        (scores.T > scores.F ? "T" : "F") +
        (scores.J > scores.P ? "J" : "P");

      const info = types[result];
      document.getElementById("quizScreen").classList.add("hidden");
      document.getElementById("resultScreen").classList.remove("hidden");
      document.getElementById("resultType").textContent = result;
      document.getElementById("resultName").textContent = info[0];
      document.getElementById("resultDesc").textContent = info[1];

      const dimensions = [
        `${scores.E > scores.I ? "外向 E" : "內向 I"} · ${Math.max(scores.E,scores.I)}/3`,
        `${scores.S > scores.N ? "實感 S" : "直覺 N"} · ${Math.max(scores.S,scores.N)}/3`,
        `${scores.T > scores.F ? "思考 T" : "情感 F"} · ${Math.max(scores.T,scores.F)}/3`,
        `${scores.J > scores.P ? "判斷 J" : "感知 P"} · ${Math.max(scores.J,scores.P)}/3`
      ];
      document.getElementById("traits").innerHTML = `
        <div class="trait"><b>特點</b><br>${info[2]}</div>
        <div class="trait"><b>特點</b><br>${info[3]}</div>
        <div class="trait"><b>偏好</b><br>${dimensions[0]} ｜ ${dimensions[1]}</div>
        <div class="trait"><b>偏好</b><br>${dimensions[2]} ｜ ${dimensions[3]}</div>
      `;
      window.currentResult = `${result}｜${info[0]}：${info[1]}`;
    }

    async function copyResult(){
      const text = `我的快速 MBTI 是 ${window.currentResult}`;
      try{
        await navigator.clipboard.writeText(text);
        alert("結果已複製，可以丟到同事群組了！");
      }catch(e){
        alert(text);
      }
    }

    function restartQuiz(){
      index = 0;
      scores = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
      document.getElementById("resultScreen").classList.add("hidden");
      document.getElementById("startScreen").classList.remove("hidden");
      document.getElementById("bar").style.width = "0%";
    }
  </script>
</body>
</html>
